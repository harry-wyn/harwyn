model: {name: "$HARWYN_WORK/models/qwen3.5-4b-h0", device: "cuda", dtype: "bfloat16", dummy: false}
data: {dataset_name: "open_thoughts", batch_size: 8, num_samples: 512, val_samples: 32,
       max_length: 2048, num_workers: 4}
quantization: {gsq_bits: 3, init_method: "gptq", gsq_enabled: true, start_layer: 0, self_attn: false,
               std: 0.01, temperature: [2, 0.05], scale: [100, 500], groupsize: 128, strength: 6,
               logits_dtype: "bfloat16"}
training: {num_epochs: 2, device_microbatch_size: 2, lr1: 0.0001, lr2: 0.00005, weight_decay: 1.0,
           checkpoint_dir: "$HARWYN_WORK/gsq-runs/3bit", log_dir: "$HARWYN_WORK/gsq-runs/3bit-logs",
           act_cache_dir: "$HARWYN_WORK/gsq-runs/act_cache", eval_baseline: false, ppl_eval_every_n_layers: 0}
gptq: {nsamples: 256, wbits: 3, sym: true, trits: false, percdamp: 0.1, blocksize: 128,
       groupsize: 128, static_groups: false, prunen: 0, prunem: 0}
wandb: false
